services:

  api:
    build:
      context: ./rag-server
      dockerfile: Dockerfile

    expose:
      - "8001"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag
      DB_USER: postgres
      DB_PASSWORD: postgres

    volumes:
      - rag-uploads:/app/uploads
      - rag-vector-store:/app/vector_store

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - rag-network


  worker:
    build:
      context: ./rag-server
      dockerfile: Dockerfile

    command: celery -A orchestration.celery_tasks worker --loglevel=info

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag
      DB_USER: postgres
      DB_PASSWORD: postgres

    volumes:
      - rag-uploads:/app/uploads
      - rag-vector-store:/app/vector_store

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - rag-network


  postgres:
    build:
      context: ./rag-server/postgres
      dockerfile: Dockerfile

    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d rag
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - rag-network


  redis:
    image: redis:7-alpine

    expose:
      - "6379"

    restart: unless-stopped

    networks:
      - rag-network


volumes:
  postgres-data:
  rag-uploads:
  rag-vector-store:


networks:
  rag-network:
    driver: bridge
